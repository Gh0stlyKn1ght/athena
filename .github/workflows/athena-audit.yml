name: Athena CI & PR Change-Intelligence Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-verify:
    name: Run Deterministic AST, Security & MCP Protocol Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository (Full History for Git Revision Tests)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Athena & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure Git Identity for Test Sandbox Repos
        run: |
          git config --global user.name "athena-ci"
          git config --global user.email "athena-ci@users.noreply.github.com"

      - name: Run Unit, MCP Protocol & Real-World Edge-Case Tests
        run: |
          pytest -v tests/test_athena_mvp.py tests/test_mcp_protocol.py tests/test_real_world_edge_cases.py

  pr-change-audit:
    name: Athena PR Breaking-Change & Blast-Radius Audit
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Athena
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Athena Change-Intelligence Audit & Write Job Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            TARGET_BASE="origin/$BASE_REF"
          else
            TARGET_BASE="AUTO"
          fi

          python -m athena breaking-changes . --base "$TARGET_BASE" --target HEAD > athena_breaking_report.json
          python -m athena release-notes . --base "$TARGET_BASE" --target HEAD --version "PR-Audit" --audience maintainers > athena_release_report.json

          python - << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          brk = json.loads(Path("athena_breaking_report.json").read_text(encoding="utf-8"))
          rel = json.loads(Path("athena_release_report.json").read_text(encoding="utf-8"))
          cov = brk.get("analysis_coverage") or {}

          print("## 🛡️ Athena Change-Intelligence & Breaking-Change Audit")
          print("")
          print("| Metric | Value |")
          print("| :--- | :--- |")
          print(f"| **Base -> Target** | `{brk.get('base_ref')}` (`{brk.get('resolved_base_sha', '')[:8]}`) -> `{brk.get('target_ref')}` (`{brk.get('resolved_target_sha', '')[:8]}`) |")
          print(f"| **Potential Breaking Changes** | **{brk.get('total_potential_breaking_changes', 0)}** |")
          print(f"| **Public API Exports Modified** | `{cov.get('public_api_exports_modified_count', 0)}` |")
          print(f"| **Unresolved Dynamic Calls** | `{cov.get('unresolved_dynamic_calls_count', 0)}` |")
          print(f"| **Static Parse Coverage** | `{cov.get('static_parse_coverage_pct', 100.0)}%` (`{cov.get('files_parsed_successfully', 0)}/{cov.get('total_code_files_eligible', 0)}` files) |")
          print(f"| **Blast-Radius Confidence** | **`{str(cov.get('overall_blast_radius_confidence', 'high')).upper()}`** — {cov.get('confidence_rationale', '')} |")
          print("")
          print("### 📋 Evidence-Grounded Release Notes Preview")
          print("")
          print(rel.get("markdown", "_No changes detected._"))
          EOF

      - name: Upload Athena Audit Reports
        uses: actions/upload-artifact@v4
        with:
          name: athena-change-intelligence-reports
          path: |
            athena_breaking_report.json
            athena_release_report.json
          retention-days: 14
